<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Downloader</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Photo Downloader</h1>
        <div class="input-container">
            <input type="text" id="imageUrl" placeholder="Enter image URL here..." />
            <button id="checkButton">Check Image</button>
        </div>
        
        <div id="imagePreview" class="hidden">
            <h2>Image Preview</h2>
            <img id="previewImage" src="" alt="Preview" />
            
            <div class="download-options">
                <h3>Download Options</h3>
                <button id="jpegButton" class="download-btn">Download as JPEG</button>
                <button id="pngButton" class="download-btn">Download as PNG</button>
            </div>
        </div>
        
        <div id="errorMessage" class="hidden">
            <p>No valid image found at the provided URL. Please check the URL and try again.</p>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
